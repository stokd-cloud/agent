      TargetType: /AWS::EC2::Instance
      UpdateMethod: NewVersion
      Tags:
        - Key: Project
          Value: stokd-agent
        - Key: Custody
          Value: bootstrap
      Content:
        schemaVersion: '2.2'
        description: Invoke only the installed, ownership-guarded Agent migration controller
        parameters:
          OperationId:
            type: String
            allowedPattern: '^[a-z0-9][a-z0-9-]{2,80}$'
          TargetStage:
            type: String
            allowedValues:
              - source-val12
              - restore-val12
        mainSteps:
          - action: aws:runShellScript
            name: InvokeGuardedMigrationHost
            inputs:
              timeoutSeconds: '1800'
              runCommand:
                - >-
                  /opt/stokd-agent/bin/migrate-host
                  --operation-id '{{ OperationId }}'
                  --target-stage '{{ TargetStage }}'

  AgentValidationSeedCommand:
    Type: AWS::SSM::Document
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: stokd-agent-validation-seed-v1
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      UpdateMethod: NewVersion
      Tags:
        - Key: Project
          Value: stokd-agent
        - Key: Custody
          Value: bootstrap
      Content:
        schemaVersion: '2.2'
        description: Seed the fixed source-stage durability fixture without dispatching work
        mainSteps:
          - action: aws:runShellScript
            name: InvokeFixedValidationSeed
            inputs:
              timeoutSeconds: '900'
              runCommand:
                - /opt/stokd-agent/bin/validation-seed-host

  AgentValidationBackupCommand:
    Type: AWS::SSM::Document
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: stokd-agent-validation-backup-v1
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      UpdateMethod: NewVersion
      Tags:
        - Key: Project
          Value: stokd-agent
        - Key: Custody
          Value: bootstrap
      Content:
        schemaVersion: '2.2'
        description: Create the fixed source-stage quiesced backup and custody receipt
        mainSteps:
          - action: aws:runShellScript
            name: InvokeFixedValidationBackup
            inputs:
              timeoutSeconds: '7200'
              runCommand:
                - /opt/stokd-agent/bin/backup-host

  AgentRestoreHostCommand:
    Type: AWS::SSM::Document
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: stokd-agent-restore-host-v1
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      UpdateMethod: NewVersion
      Tags:
        - Key: Project
          Value: stokd-agent
        - Key: Custody
          Value: bootstrap
      Content:
        schemaVersion: '2.2'
        description: Invoke only the installed, ownership-guarded Agent restore host controller
        parameters:
          OperationId:
            type: String
            allowedPattern: '^[a-z0-9][a-z0-9-]{2,80}$'
          ManifestKey:
            type: String
            allowedPattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,512}$'
          ManifestVersionId:
            type: String
            allowedPattern: '^[A-Za-z0-9._=+/-]{1,1000}$'
          ManifestSha256:
            type: String
            allowedPattern: '^[a-f0-9]{64}$'
          ArchiveKey:
            type: String
            allowedPattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,512}$'
          ArchiveVersionId:
            type: String
            allowedPattern: '^[A-Za-z0-9._=+/-]{1,1000}$'
          ArchiveSha256:
            type: String
            allowedPattern: '^[a-f0-9]{64}$'
        mainSteps:
          - action: aws:runShellScript
            name: InvokeGuardedRestoreHost
            inputs:
              timeoutSeconds: '7200'
              runCommand:
                - >-
                  /opt/stokd-agent/bin/restore-host
                  --operation-id '{{ OperationId }}'
                  --source-bucket 'stokd-agent-backups-source-val12-167217327520'
                  --manifest-key '{{ ManifestKey }}'
                  --manifest-version-id '{{ ManifestVersionId }}'
                  --manifest-sha256 '{{ ManifestSha256 }}'
                  --archive-key '{{ ArchiveKey }}'
                  --archive-version-id '{{ ArchiveVersionId }}'
                  --archive-sha256 '{{ ArchiveSha256 }}'
                  --target-stage 'restore-val12'

  AgentValidationCertificate:
    Type: AWS::CertificateManager::Certificate
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: agent-source-val12.stokd.cloud
      SubjectAlternativeNames:
        - agent-restore-val12.stokd.cloud
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: agent-source-val12.stokd.cloud
          HostedZoneId: Z0974146XEXJDMNXU573
        - DomainName: agent-restore-val12.stokd.cloud
          HostedZoneId: Z0974146XEXJDMNXU573
      Tags:
        - Key: Project
          Value: stokd-agent
        - Key: Custody
          Value: bootstrap

  AgentValidationCertificateParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: /stokd-agent/shared/validation-certificate/v1
      Type: String
      Value: !Ref AgentValidationCertificate
      Description: Exact retained SAN certificate for the two Agent validation hostnames
      Tags:
        Project: stokd-agent
        Custody: bootstrap
  # Terraform state. Retained, versioned and KMS-encrypted: losing this bucket
  # orphans every resource Terraform manages. Its own key is separate from the
  # per-stage data keys so state custody and data custody fail independently.
  AgentTerraformStateKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Retained Agent Terraform state custody
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # KMS refuses any policy that could lock out future policy updates,
          # so the account must retain administrative access. Access control is
          # then delegated to IAM, where the deploy boundary applies.
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: BoundedDeployAdministration
            Effect: Allow
            Principal: '*'
            Resource: '*'
            Action:
              - kms:DescribeKey
              - kms:EnableKeyRotation
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:TagResource
              - kms:UntagResource
            Condition:
              StringEquals:
                aws:PrincipalArn: !GetAtt AgentValidationDeployRole.Arn
          - Sid: BoundedDeployStateUse
            Effect: Allow
            Principal: '*'
            Resource: '*'
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
            Condition:
              StringEquals:
                aws:PrincipalArn: !GetAtt AgentValidationDeployRole.Arn
                kms:ViaService: s3.us-east-1.amazonaws.com
      Tags:
        - Key: Project
          Value: stokd-agent
        - Key: Custody
          Value: bootstrap

  AgentTerraformStateKeyAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AliasName: alias/stokd-agent-tfstate
      TargetKeyId: !Ref AgentTerraformStateKey

  AgentTerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub stokd-agent-tfstate-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt AgentTerraformStateKey.Arn
            BucketKeyEnabled: true
      Tags:
        - Key: Project
          Value: stokd-agent
        - Key: Custody
          Value: bootstrap

  AgentTerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref AgentTerraformStateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTls
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AgentTerraformStateBucket.Arn
              - !Sub '${AgentTerraformStateBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyUnencryptedWrites
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${AgentTerraformStateBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms

Outputs:
  TerraformStateBucketName:
    Value: !Ref AgentTerraformStateBucket
  TerraformStateKmsKeyId:
    Value: !Ref AgentTerraformStateKeyAlias
  DeployRoleArn:
    Value: !GetAtt AgentValidationDeployRole.Arn
  DeployPermissionsBoundaryArn:
    Value: !Ref AgentDeployPermissionsBoundary
  WorkloadPermissionsBoundaryArn:
    Value: !Ref AgentWorkloadPermissionsBoundary
  RuntimeRepositoryUri:
    Value: !GetAtt AgentRuntimeRepository.RepositoryUri
  GitHubOidcProviderArn:
    Value: !Ref ExistingGitHubOidcProviderArn
  GitHubOidcSubject:
    Value: repo:stokd-cloud/agent:environment:agent-validation
  MigrateHostCommandDocument:
    Value: !Ref AgentMigrateHostCommand
  ValidationSeedCommandDocument:
    Value: !Ref AgentValidationSeedCommand
  ValidationBackupCommandDocument:
    Value: !Ref AgentValidationBackupCommand
  RestoreHostCommandDocument:
    Value: !Ref AgentRestoreHostCommand
  ValidationCertificateArn:
    Value: !Ref AgentValidationCertificate
