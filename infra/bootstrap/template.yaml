    Properties:
      RoleName: stokd-agent-validation-deploy
      MaxSessionDuration: 3600
      PermissionsBoundary: !Ref AgentDeployPermissionsBoundary
      ManagedPolicyArns:
        - !Ref AgentDeployFoundationPolicy
        - !Ref AgentDeployRuntimePolicy
        - !Ref AgentDeployCustodyPolicy
        - !Ref AgentDeployControlPolicy
        - !Ref AgentDeploySstHomePolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: GitHubEnvironmentOnly
            Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # GitHub now issues immutable subject claims for this repo
                # (sub_claim_prefix repo:stokd-cloud@264210261/agent@1354224769).
                # Both exact forms are accepted so the trust survives the
                # rollout in either direction. No wildcards.
                token.actions.githubusercontent.com:sub:
                  - repo:stokd-cloud/agent:environment:agent-validation
                  - repo:stokd-cloud@264210261/agent@1354224769:environment:agent-validation
      Tags:
        - Key: Project
          Value: stokd-agent
        - Key: Custody
          Value: bootstrap


