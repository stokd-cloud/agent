AWSTemplateFormatVersion: '2010-09-09'
Description: Bounded GitHub OIDC deploy identity and private image custody for Stokd Agent validation
Parameters:
  ExistingGitHubOidcProviderArn:
    Type: String
    AllowedValues:
      - arn:aws:iam::167217327520:oidc-provider/token.actions.githubusercontent.com
    Description: Exact existing GitHub Actions OIDC provider in account 167217327520
  ExistingSstBootstrapVersion:
    Type: Number
    AllowedValues: [5]
    Description: Exact version read from the existing shared /sst/bootstrap record
  ExistingSstBootstrapSha256:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 of the exact existing shared /sst/bootstrap value
  ExistingSstStateBucketName:
    Type: String
    AllowedPattern: '^sst-state-[a-z0-9]{12}$'
    Description: Existing shared SST state bucket read from /sst/bootstrap; never created here
  ExistingSstAssetBucketName:
    Type: String
    AllowedPattern: '^sst-asset-[a-z0-9]{12}$'
    Description: Existing shared SST asset bucket read from /sst/bootstrap; never created here
  ExistingSstAssetEcrRegistryId:
    Type: String
    AllowedValues: ['167217327520']
    Description: Existing shared SST asset ECR registry read from /sst/bootstrap
  ExistingSstAssetEcrUrl:
    Type: String
    AllowedValues:
      - 167217327520.dkr.ecr.us-east-1.amazonaws.com/sst-asset
    Description: Existing shared SST asset ECR URL read from /sst/bootstrap
Resources:
  AgentRuntimeRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: stokd-agent-runtime
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Retain the latest 60 immutable validation images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":60},"action":{"type":"expire"}}]}
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTls
            Effect: Deny
            Principal: '*'
            Action: 'ecr:*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
      Tags:
        - Key: Project
          Value: stokd-agent
        - Key: Custody
          Value: bootstrap

  AgentWorkloadPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: stokd-agent-workload-boundary
      Description: Maximum permissions for Agent ECS and EC2 runtime identities
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadRuntimeImages
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: '*'
          - Sid: AgentObjectCustody
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:GetBucketVersioning
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:PutObjectTagging
              - s3:AbortMultipartUpload
            Resource:
              - arn:aws:s3:::stokd-agent-artifacts-*-167217327520
              - arn:aws:s3:::stokd-agent-artifacts-*-167217327520/*
              - arn:aws:s3:::stokd-agent-backups-*-167217327520
              - arn:aws:s3:::stokd-agent-backups-*-167217327520/*
          - Sid: AgentEncryption
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: arn:aws:kms:us-east-1:167217327520:key/*
            Condition:
              StringEquals:
                aws:ResourceTag/Project: stokd-agent
          - Sid: AgentSecrets
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:ListSecretVersionIds
            Resource: arn:aws:secretsmanager:us-east-1:167217327520:secret:stokd-agent-*
          - Sid: RestoreTargetSecretVersionRotation
            Effect: Allow
            Action: secretsmanager:PutSecretValue
            Resource: arn:aws:secretsmanager:us-east-1:167217327520:secret:stokd-agent-restore-val12-*
          - Sid: ExactApiAdmission
            Effect: Allow
            Action:
              - ecs:DescribeServices
              - ecs:UpdateService
            Resource:
              - arn:aws:ecs:us-east-1:167217327520:service/stokd-agent-api-source-val12/stokd-agent-api-source-val12
              - arn:aws:ecs:us-east-1:167217327520:service/stokd-agent-api-restore-val12/stokd-agent-api-restore-val12
          - Sid: RuntimeObservability
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
              - ec2:DescribeInstances
              - ec2:DescribeVolumes
              - ec2messages:AcknowledgeMessage
              - ec2messages:DeleteMessage
              - ec2messages:FailMessage
              - ec2messages:GetEndpoint
              - ec2messages:GetMessages
              - ec2messages:SendReply
              - logs:CreateLogStream
              - logs:PutLogEvents
              - ssm:UpdateInstanceInformation
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'
          - Sid: FinalizeOwnedFreshVolumeOnce
            Effect: Allow
            Action: ec2:CreateTags
            Resource: arn:aws:ec2:us-east-1:167217327520:volume/*
            Condition:
              StringEquals:
                ec2:ResourceTag/Project: stokd-agent
                ec2:ResourceTag/InitializationState: pending-v1
                aws:RequestTag/InitializationState: initialized-v1
              StringLike:
                ec2:ResourceTag/Stage:
                  - source-val12
                  - restore-val12
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - InitializationState
          - Sid: NoRuntimeDestructionOrRedispatch
            Effect: Deny
            Action:
              - ecs:RunTask
              - events:PutEvents
              - lambda:InvokeFunction
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - secretsmanager:DeleteSecret
              - sns:Publish
              - sqs:SendMessage
              - states:StartExecution
            Resource: '*'

  AgentDeployPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: stokd-agent-validation-deploy-boundary
      Description: Maximum permissions for the GitHub OIDC Agent validation deploy role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Resource: '*'
          Action:
          - sts:GetCallerIdentity
          - acm:Describe*
          - acm:List*
          - cloudformation:Describe*
          - cloudformation:Get*
          - cloudformation:List*
          - ecr:Batch*
          - ecr:Describe*
          - ecr:Get*
          - ecr:List*
          - iam:Get*
          - iam:List*
          - kms:Describe*
          - kms:Get*
          - kms:List*
          - route53:ChangeResourceRecordSets
          - route53:ChangeTagsForResource
          - route53:CreateHealthCheck
          - route53:CreateHostedZone
          - route53:DeleteHealthCheck
          - route53:Get*
          - route53:List*
          - s3:GetAccountPublicAccessBlock
          - secretsmanager:GetRandomPassword
          - ssm:Describe*
          - ssm:Get*
          - ssm:List*
        - Effect: Allow
          Resource: '*'
          Action:
          - ec2:*
          - ecs:*
          - elasticloadbalancing:*
          - logs:*
          - servicediscovery:*
          Condition:
            StringEquals:
              aws:RequestedRegion: us-east-1
        - Effect: Allow
          Action:
          - iam:*InstanceProfile
          - iam:*Role
          - iam:DeleteRolePolicy
          - iam:PutRole*
          Resource:
          - arn:aws:iam::167217327520:role/stokd-agent-workload-*
          - arn:aws:iam::167217327520:instance-profile/stokd-agent-workload-*
        - Effect: Allow
          Action: iam:CreateServiceLinkedRole
          Resource: arn:aws:iam::167217327520:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
          Condition:
            StringEquals:
              iam:AWSServiceName: ecs.application-autoscaling.amazonaws.com
        - Effect: Allow
          Action: kms:CreateKey
          Resource: '*'
          Condition:
            StringEquals:
              aws:RequestedRegion: us-east-1
              aws:RequestTag/Project: stokd-agent
            StringLike:
              aws:RequestTag/Stage:
              - source-val12
              - restore-val12
        - Effect: Allow
          Action:
          - kms:EnableKeyRotation
          - kms:PutKeyPolicy
          - kms:*TagResource
          - kms:UpdateAlias
          Resource: arn:aws:kms:us-east-1:167217327520:key/*
          Condition:
            StringEquals:
              aws:ResourceTag/Project: stokd-agent
        - Effect: Allow
          Action: kms:CreateAlias
          Resource:
          - arn:aws:kms:us-east-1:167217327520:key/*
          - arn:aws:kms:us-east-1:167217327520:alias/stokd-agent-*
        - Effect: Allow
          Action:
          - kms:Decrypt
          - kms:Encrypt
          - kms:GenerateDataKey*
          - kms:ReEncrypt*
          Resource: arn:aws:kms:us-east-1:167217327520:key/*
          Condition:
            StringEquals:
              aws:ResourceTag/Project: stokd-agent
            StringLike:
              kms:ViaService:
              - ec2.us-east-1.amazonaws.com
              - secretsmanager.us-east-1.amazonaws.com
        - Effect: Allow
          Action:
          - kms:Decrypt
          - kms:Encrypt
          - kms:GenerateDataKey*
          - kms:ReEncrypt*
          Resource: arn:aws:kms:us-east-1:167217327520:key/*
          Condition:
            StringEquals:
              aws:ResourceTag/Project: stokd-agent
              kms:ViaService: s3.us-east-1.amazonaws.com
            StringLike:
              kms:EncryptionContext:aws:s3:arn:
              - arn:aws:s3:::stokd-agent-artifacts-source-val12-167217327520
              - arn:aws:s3:::stokd-agent-artifacts-restore-val12-167217327520
              - arn:aws:s3:::stokd-agent-artifacts-source-val12-167217327520/validation/work-1.2/source-val12/*
              - arn:aws:s3:::stokd-agent-artifacts-restore-val12-167217327520/validation/work-1.2/restore-val12/*
              - arn:aws:s3:::stokd-agent-tfstate-167217327520/work-1.2/*
        - Effect: Allow
          Action: kms:CreateGrant
          Resource: arn:aws:kms:us-east-1:167217327520:key/*
          Condition:
            Bool:
              kms:GrantIsForAWSResource: 'true'
            StringEquals:
              aws:ResourceTag/Project: stokd-agent
        - Effect: Allow
          Action:
          - s3:CreateBucket
          - s3:GetAccelerateConfiguration
          - s3:GetBucket*
          - s3:GetEncryptionConfiguration
          - s3:GetLifecycleConfiguration
          - s3:GetReplicationConfiguration
          - s3:GetObject*
          - s3:List*
          - s3:PutBucket*
          - s3:PutEncryptionConfiguration
          - s3:PutLifecycleConfiguration
          - s3:PutObject*
          Resource:
          - arn:aws:s3:::stokd-agent-*-167217327520
          - arn:aws:s3:::stokd-agent-*-167217327520/*
        - Effect: Allow
          Action:
          - s3:GetBucketPolicy
          - s3:GetBucketPublicAccessBlock
          - s3:GetBucketLocation
          - s3:GetBucketOwnershipControls
          - s3:GetBucketVersioning
          - s3:GetEncryptionConfiguration
          - s3:GetLifecycleConfiguration
          Resource: !Sub arn:aws:s3:::${ExistingSstStateBucketName}
        - Effect: Allow
          Action:
          - s3:ListBucket
          - s3:ListBucketVersions
          Resource: !Sub arn:aws:s3:::${ExistingSstStateBucketName}
          Condition:
            StringLike:
              s3:prefix:
              - app/stokd-agent-data
              - app/stokd-agent-api
              - '*/stokd-agent-data/source-val12*'
              - '*/stokd-agent-api/source-val12*'
              - '*/stokd-agent-data/restore-val12*'
              - '*/stokd-agent-api/restore-val12*'
              - secret/stokd-agent-data/_fallback.json
              - secret/stokd-agent-api/_fallback.json
              - bootstrap-init/work-1.2/*
        - Effect: Allow
          Action: s3:DeleteObject
          Resource:
          - !Sub arn:aws:s3:::${ExistingSstStateBucketName}/lock/stokd-agent-data/source-val12.json
          - !Sub arn:aws:s3:::${ExistingSstStateBucketName}/lock/stokd-agent-api/source-val12.json
          - !Sub arn:aws:s3:::${ExistingSstStateBucketName}/lock/stokd-agent-data/restore-val12.json
          - !Sub arn:aws:s3:::${ExistingSstStateBucketName}/lock/stokd-agent-api/restore-val12.json
        - Effect: Allow
          Action:
          - secretsmanager:CreateSecret
          - secretsmanager:DescribeSecret
          - secretsmanager:GetResourcePolicy
          - secretsmanager:ListSecretVersionIds
          - secretsmanager:*TagResource
          - secretsmanager:UpdateSecret
          Resource: arn:aws:secretsmanager:us-east-1:167217327520:secret:stokd-agent-*
        - Effect: Allow
          Action:
          - ssm:*Tags*
          - ssm:DeleteParameter
          - ssm:PutParameter
          - ssm:SendCommand
          Resource:
          - arn:aws:ssm:us-east-1:167217327520:parameter/stokd-agent/*
          - arn:aws:ssm:us-east-1:167217327520:document/stokd-agent-*-v1
          - arn:aws:ec2:us-east-1:167217327520:instance/*
        - Effect: Allow
          Action:
          - route53:ChangeResourceRecordSets
          - ecr:CompleteLayerUpload
          - ecr:InitiateLayerUpload
          - ecr:PutImage
          - ecr:UploadLayerPart
          - cloudformation:CreateChangeSet
          - cloudformation:CreateStack
          - cloudformation:DeleteChangeSet
          - cloudformation:ExecuteChangeSet
          - cloudformation:UpdateStack
          Resource:
          - arn:aws:route53:::hostedzone/Z0974146XEXJDMNXU573
          - arn:aws:ecr:us-east-1:167217327520:repository/stokd-agent-runtime
          - arn:aws:cloudformation:us-east-1:167217327520:stack/stokd-agent-*/*

  AgentDeployFoundationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: stokd-agent-validation-deploy-foundation
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: IdentityAndReadback
          Effect: Allow
          Action:
          - sts:GetCallerIdentity
          - application-autoscaling:DescribeScalableTargets
          - application-autoscaling:DescribeScalingPolicies
          - application-autoscaling:ListTagsForResource
          - acm:DescribeCertificate
          - acm:ListCertificates
          - acm:ListTagsForCertificate
          - cloudformation:DescribeStackEvents
          - cloudformation:DescribeStackResources
          - cloudformation:DescribeStacks
          - cloudformation:GetTemplate
          - cloudformation:ListStackResources
          - ec2:Describe*
          - ecr:BatchCheckLayerAvailability
          - ecr:BatchGetImage
          - ecr:Describe*
          - ecr:GetAuthorizationToken
          - ecr:GetDownloadUrlForLayer
          - ecr:GetLifecyclePolicy
          - ecr:GetRepositoryPolicy
          - ecr:ListTagsForResource
          - ecr:ListImages
          - ecs:Describe*
          - ecs:List*
          - elasticloadbalancing:Describe*
          - events:DescribeRule
          - events:ListTargetsByRule
          - iam:GetInstanceProfile
          - iam:GetOpenIDConnectProvider
          - iam:GetPolicy
          - iam:GetPolicyVersion
          - iam:GetRole
          - iam:GetRolePolicy
          - iam:ListAttachedRolePolicies
          - iam:ListInstanceProfilesForRole
          - iam:ListOpenIDConnectProviders
          - iam:ListRolePolicies
          - kms:DescribeKey
          - kms:GetKeyPolicy
          - kms:GetKeyRotationStatus
          - kms:ListAliases
          - kms:ListResourceTags
          - logs:DescribeLogGroups
          - logs:ListTagsForResource
          - route53:Get*
          - route53:ListResourceRecordSets
          - s3:GetAccountPublicAccessBlock
          - servicediscovery:GetInstance
          - servicediscovery:GetNamespace
          - servicediscovery:GetOperation
          - servicediscovery:GetService
          - servicediscovery:GetServiceAttributes
          - servicediscovery:ListInstances
          - servicediscovery:ListNamespaces
          - servicediscovery:ListOperations
          - servicediscovery:ListServices
          - servicediscovery:ListTagsForResource
          - ssm:DescribeParameters
          - ssm:DescribeDocument
          - ssm:GetDocument
          - ssm:ListTagsForResource
          Resource: '*'
        - Sid: CreateTaggedRegionalResources
          Effect: Allow
          Action:
          - ec2:CreateInternetGateway
          - ec2:CreateNetworkInterface
          - ec2:CreateRouteTable
          - ec2:CreateSecurityGroup
          - ec2:CreateSubnet
          - ec2:CreateVolume
          - ec2:CreateVpc
          - ec2:CreateVpcEndpoint
          - ecs:CreateCluster
          - ecs:CreateService
          - ecs:RegisterTaskDefinition
          - elasticloadbalancing:CreateLoadBalancer
          - elasticloadbalancing:CreateTargetGroup
          - kms:CreateKey
          - logs:CreateLogGroup
          - servicediscovery:CreatePrivateDnsNamespace
          - servicediscovery:CreateService
          - servicediscovery:TagResource
          Resource: '*'
          Condition:
            StringEquals:
              aws:RequestedRegion: us-east-1
              aws:RequestTag/Project: stokd-agent
            StringLike:
              aws:RequestTag/Stage:
              - source-val12
              - restore-val12
        - Sid: CreateInsideTaggedAgentVpc
          Effect: Allow
          Action:
          - ec2:CreateSecurityGroup
          - ec2:CreateSubnet
          - ec2:CreateRouteTable
          - ec2:CreateVpcEndpoint
          - ec2:CreateNetworkInterface
          Resource:
          - arn:aws:ec2:us-east-1:167217327520:vpc/*
          - arn:aws:ec2:us-east-1:167217327520:subnet/*
          - arn:aws:ec2:us-east-1:167217327520:security-group/*
          - arn:aws:ec2:us-east-1:167217327520:route-table/*
          - arn:aws:ec2:us-east-1:167217327520:vpc-endpoint/*
          Condition:
            StringEquals:
              aws:ResourceTag/Project: stokd-agent
        - Sid: TagOnlyAtCreation
          Effect: Allow
          Action: ec2:CreateTags
          Resource: arn:aws:ec2:us-east-1:167217327520:*/*
          Condition:
            StringEquals:
              ec2:CreateAction:
              - CreateVpc
              - CreateSubnet
              - CreateSecurityGroup
              - CreateRouteTable
              - CreateInternetGateway
              - CreateVpcEndpoint
              - CreateNetworkInterface
              - CreateVolume
              - RunInstances
              - AuthorizeSecurityGroupIngress
              - AuthorizeSecurityGroupEgress
        - Sid: CloudMapPrivateZone
          Effect: Allow
          Action:
          # Cloud Map creates the private zone, registers instances as A records
          # in it, and attaches a health check per registration. All three are
          # performed by Cloud Map on the caller's behalf.
          - route53:ChangeResourceRecordSets
          - route53:ChangeTagsForResource
          - route53:CreateHealthCheck
          - route53:CreateHostedZone
          - route53:DeleteHealthCheck
          Resource: '*'
        - Sid: RunOnlyPinnedAgentAmi
          Effect: Allow
          Action: ec2:RunInstances
          Resource: arn:aws:ec2:us-east-1::image/ami-0fe74bfcad4fd6bd2
          Condition:
            StringEquals:
              aws:RequestedRegion: us-east-1
        - Sid: RunOnlyInsideTaggedAgentNetwork
          Effect: Allow
          Action: ec2:RunInstances
          Resource:
          - arn:aws:ec2:us-east-1:167217327520:security-group/*
          - arn:aws:ec2:us-east-1:167217327520:subnet/*
          Condition:
            StringEquals:
              aws:RequestedRegion: us-east-1
              ec2:ResourceTag/Project: stokd-agent
            StringLike:
              ec2:ResourceTag/Stage:
              - source-val12
              - restore-val12
        - Sid: RunOnlyExistingTaggedAgentEni
          Effect: Allow
          Action: ec2:RunInstances
          Resource: arn:aws:ec2:us-east-1:167217327520:network-interface/*
          Condition:
            StringEquals:
              aws:RequestedRegion: us-east-1
              ec2:ResourceTag/Project: stokd-agent
            StringLike:
              ec2:ResourceTag/Stage:
              - source-val12
              - restore-val12
        - Sid: RunOnlyBoundedAgentInstanceProfile
          Effect: Allow
          Action: ec2:RunInstances
          Resource: arn:aws:iam::167217327520:instance-profile/stokd-agent-workload-*
          Condition:
            StringEquals:
              aws:RequestedRegion: us-east-1
        - Sid: RunOnlyTaggedAgentCompute
          Effect: Allow
          Action: ec2:RunInstances
          Resource:
          - arn:aws:ec2:us-east-1:167217327520:instance/*
          - arn:aws:ec2:us-east-1:167217327520:internet-gateway/*
          - arn:aws:ec2:us-east-1:167217327520:volume/*
          Condition:
            StringEquals:
              aws:RequestedRegion: us-east-1
              aws:RequestTag/Project: stokd-agent
            StringLike:
              aws:RequestTag/Stage:
              - source-val12
              - restore-val12
        - Sid: TagAgentResourcesDuringBoundedCreate
          Effect: Allow
          Action: ec2:CreateTags
          Resource:
          - arn:aws:ec2:us-east-1:167217327520:instance/*
          - arn:aws:ec2:us-east-1:167217327520:network-interface/*
          - arn:aws:ec2:us-east-1:167217327520:route-table/*
          - arn:aws:ec2:us-east-1:167217327520:security-group/*
          - arn:aws:ec2:us-east-1:167217327520:subnet/*
          - arn:aws:ec2:us-east-1:167217327520:volume/*
          - arn:aws:ec2:us-east-1:167217327520:vpc/*
          - arn:aws:ec2:us-east-1:167217327520:vpc-endpoint/*
          Condition:
            StringEquals:
              aws:RequestedRegion: us-east-1
              aws:RequestTag/Project: stokd-agent
            StringLike:
              aws:RequestTag/Stage:
              - source-val12
              - restore-val12
              ec2:CreateAction:
              - CreateRouteTable
              - CreateInternetGateway
              - CreateNetworkInterface
              - CreateSecurityGroup
              - CreateSubnet
              - CreateVolume
              - CreateVpc
              - CreateVpcEndpoint
              - RunInstances

