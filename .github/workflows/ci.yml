name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only changes skip compilation and regressions. Any path outside
  # the allowlist, including workflows, counts as code. Non-PR events run all checks.
  # Keep the workflow active: ci-gate is required and must report for docs PRs too.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/github-script@v9
        id: filter
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('code', 'true')
              core.notice('Non-PR event; run code checks')
              return
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            })
            const DOCS_ONLY = [
              /^docs\//,
              /^README(_EN)?\.md$/,
              /^\.github\/ISSUE_TEMPLATE\//,
              /^\.github\/PULL_REQUEST_TEMPLATE(\.md)?$/,
              /^LICENSE$/,
            ]
            const paths = files.map(f => f.filename)
            // An empty changeset still runs the code checks.
            const code = paths.length === 0
              || paths.some(p => !DOCS_ONLY.some(re => re.test(p)))
            core.setOutput('code', String(code))
            core.notice(`${paths.length} changed files; code=${code}`)

  # Code PRs need an issue linked through closingIssuesReferences. Docs-only
  # changes, bots and the explicit no-issue-needed maintainer label are exempt.
  # Apply the historical cutoff without retroactively rejecting older PRs.
  issue-link:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // Push events have no pull request to inspect.
            if (context.eventName !== 'pull_request') {
              core.notice('Non-PR event; skip the issue-link check')
              return
            }
            const pr = context.payload.pull_request
            const CUTOFF = '2026-08-25T00:00:00Z'
            if (new Date(pr.created_at) < new Date(CUTOFF)) {
              core.notice(`PR created ${pr.created_at}, before cutoff ${CUTOFF}; legacy exemption applies`)
              return
            }
            if (pr.user.type === 'Bot' || pr.user.login.endsWith('[bot]')) {
              core.notice(`Author ${pr.user.login} is a bot; exempt`)
              return
            }
            if ((pr.labels ?? []).some(l => l.name === 'no-issue-needed')) {
              core.notice('Maintainer exemption: no-issue-needed label')
              return
            }
            // Let query failures fail the step, matching the fail-closed ci-gate.
            const { repository } = await github.graphql(
              `query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first: 20) { nodes { number } }
                  }
                }
              }`,
              { owner: context.repo.owner, repo: context.repo.repo, number: pr.number },
            )
            const linked = repository.pullRequest.closingIssuesReferences.nodes.map(n => n.number)
            if (linked.length === 0) {
              core.setFailed(
                'Code PRs need a linked issue. Add `Closes #<issue>` to the description '
                + 'or link it through Development. Upstream proposals follow the donor '
                + 'issue workflow; see docs/contributing.md.',
              )
              return
            }
            core.notice(`Linked issues: ${linked.map(n => `#${n}`).join(' ')}`)

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Keep UI language deterministic for the repro/verify scripts: zh is the
      # historical script-context default; scripts asserting English copy pin
      # DSH_TUI_LANG=en themselves before their dynamic imports.
      DSH_TUI_LANG: zh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify generated output is not checked in
        run: test -z "$(git ls-files -- lib)"

      # Read the package manager version from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Install dependencies without lifecycle compilation. Compile once below;
      # downstream groups reuse the output artifact. Workspace allowBuilds already
      # disables the esbuild/koffi dependency build scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # lib/ is not checked in. Compile it once from a clean output directory;
      # the following gates reuse this exact runtime instead of rebuilding it.
      - run: pnpm compile

      - name: Verify clean compile output
        run: |
          test -f lib/types/index.js
          test -f lib/types/dsh-adapter/invariant.js

      - run: pnpm verify:build

      # Keep every main/types/bin/exports target inside the published tarball
      # and smoke-import the two runtime entry points.
      - run: pnpm verify:package
      - run: pnpm verify:bun-package

      - name: Install Rust toolchain for the Stokd domain engine
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify the Rust agent and DSH TUI integration
        env:
          DSH_TUI_LANG: en
          TMPDIR: /tmp
        run: |
          cargo fmt --manifest-path apps/agent-cli/Cargo.toml --check
          cargo test --manifest-path apps/agent-cli/Cargo.toml --locked
          cargo clippy --manifest-path apps/agent-cli/Cargo.toml --all-targets --locked -- -D warnings
          cargo build --manifest-path apps/agent-cli/Cargo.toml --locked
          pnpm verify:stokd
          python3 scripts/verify-stokd-pty.py

      # Downstream groups reuse this build artifact. Workspace links provide
      # @dsh-std runtime modules without its build toolchain. Each job checks out
      # the TypeScript sources needed by source-importing regressions.
      - name: Upload compiled output
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: error
          path: |
            lib/
            dsh-auth/lib/
            vendor/dsh-std/packages/core/lib/
            vendor/dsh-std/packages/manifest/lib/
            vendor/dsh-std/packages/connection/lib/
            vendor/dsh-std/packages/presentation/lib/
            vendor/dsh-std/packages/command/lib/
            vendor/dsh-std/packages/storage/lib/
            vendor/dsh-std/packages/messages/lib/

  # Alpha is source-first (alpha.2 also ships to npm, but CI keeps the rc.2
  # build as the installed baseline). Type-check the adapter and compose both
  # patches against the immutable upstream alpha.2 source SHA. Missing source
  # is a hard failure.
  alpha-compat:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      DSH_TUI_LANG: zh
      DSH_HARNESS_SOURCE_ROOT: ${{ github.workspace }}/.upstream/deepseek-harness
      DSH_REQUIRE_ALPHA_BASELINE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # deepseek-ai/deepseek-harness tag dsh-v0.1.2-alpha.2
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 0a53fb55bea101816fa226bb964ae2bed71c343b
          path: .upstream/deepseek-harness
          fetch-depth: 1

      # Read the package manager version from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .upstream/deepseek-harness/pnpm-lock.yaml

      - run: pnpm --dir "$DSH_HARNESS_SOURCE_ROOT" install --frozen-lockfile --ignore-scripts

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # build keeps the installed rc.2 regression line green and, with the
      # required source env above, must also compose the alpha base/web patch.
      - run: pnpm build

      - run: pnpm verify:alpha-source

      # Run the 48 dsh-auth provider regressions with the dependencies/output
      # already prepared by build:dsh-auth. minimal-preset-tools is already in
      # verify:build and must not run twice.
      - run: pnpm --dir dsh-auth verify

  # Rendering, scrolling, resize, subagents and pickers run independently.
  # Compilation happens only in build; this group reuses its artifact.
  render-scroll:
    needs: build
    runs-on: ubuntu-latest
    env:
      DSH_TUI_LANG: zh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Read the package manager version from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Install dependencies and reuse the compiled build artifact.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore compiled output
        uses: actions/download-artifact@v8
        with:
          name: ci-build-${{ github.run_id }}
      # Run every regression even after a failure, then report the aggregate.
      # Any failure exits 1. Keep the registry in scripts/run-ci-group.mjs current.
      - run: node scripts/run-ci-group.mjs render-scroll

  # Input, terminal protocols, teardown and system integration run independently.
  # This group reuses the build artifact.
  input-terminal:
    needs: build
    runs-on: ubuntu-latest
    env:
      DSH_TUI_LANG: zh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Read the package manager version from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Install dependencies and reuse the compiled build artifact.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore compiled output
        uses: actions/download-artifact@v8
        with:
          name: ci-build-${{ github.run_id }}
      # Run every regression even after a failure, then report the aggregate.
      # Any failure exits 1. Keep the registry in scripts/run-ci-group.mjs current.
      - run: node scripts/run-ci-group.mjs input-terminal

  # Session, workspace, extensions and resume regressions run independently.
  # This group reuses the build artifact.
  session-workspace:
    needs: build
    runs-on: ubuntu-latest
    env:
      DSH_TUI_LANG: zh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Read the package manager version from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Install dependencies and reuse the compiled build artifact.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore compiled output
        uses: actions/download-artifact@v8
        with:
          name: ci-build-${{ github.run_id }}
      # Run every regression even after a failure, then report the aggregate.
      # Any failure exits 1. Keep the registry in scripts/run-ci-group.mjs current.
      - run: node scripts/run-ci-group.mjs session-workspace

  # Channel and UI application regressions run independently.
  # This group reuses the build artifact.
  channel-ui:
    needs: build
    runs-on: ubuntu-latest
    env:
      DSH_TUI_LANG: zh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Read the package manager version from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Install dependencies and reuse the compiled build artifact.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore compiled output
        uses: actions/download-artifact@v8
        with:
          name: ci-build-${{ github.run_id }}
      # Run every regression even after a failure, then report the aggregate.
      # Any failure exits 1. Keep the registry in scripts/run-ci-group.mjs current.
      - run: node scripts/run-ci-group.mjs channel-ui

  # Observe known timing-sensitive regressions without blocking ci-gate.
  # verify-resize-temporal depends on settle windows under heavy Linux load;
  # verify-trace-scene can exceed its four-second polling window during rendering.
  # Return them to the required groups after the probes become deterministic.
  flaky-observation:
    needs: build
    runs-on: ubuntu-latest
    env:
      DSH_TUI_LANG: zh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Read the package manager version from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Install dependencies and reuse the compiled build artifact.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore compiled output
        uses: actions/download-artifact@v8
        with:
          name: ci-build-${{ github.run_id }}

      # Run every regression even after a failure, then report the aggregate.
      # Any failure exits 1. Keep the registry in scripts/run-ci-group.mjs current.
      - run: node scripts/run-ci-group.mjs flaky-observation

  # Observe Windows ConPTY/path/line-ending and macOS PTY/toolchain behavior.
  # Install, compile and import entries on both platforms without blocking ci-gate.
  # Keep fail-fast disabled so both platforms report; expand coverage before
  # promoting this lane to required.
  platform-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DSH_TUI_LANG: zh
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Read the package manager version from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Match the build job's explicit compilation. Use bash for portable
      # test and pipeline syntax when pnpm forwards scripts through npm on Windows.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm compile

      - run: |
          test -f lib/types/index.js
          test -f lib/types/dsh-adapter/invariant.js

      - name: Smoke-import compiled entry
        run: node -e "import('./lib/types/index.js').then(() => console.log('entry import ok')).catch(e => { console.error(e); process.exit(1) })"

  # ci-gate is the stable required check. Aggregate every required group and
  # explicitly fail on failure or cancellation. Always run even after upstream
  # failures, so changes to internal job names cannot silently weaken protection.
  ci-gate:
    needs: [changes, issue-link, build, alpha-compat, render-scroll, input-terminal, session-workspace, channel-ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every group to have succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          ISSUE_LINK: ${{ needs.issue-link.result }}
          BUILD: ${{ needs.build.result }}
          ALPHA_COMPAT: ${{ needs.alpha-compat.result }}
          RENDER_SCROLL: ${{ needs.render-scroll.result }}
          INPUT_TERMINAL: ${{ needs.input-terminal.result }}
          SESSION_WORKSPACE: ${{ needs.session-workspace.result }}
          CHANNEL_UI: ${{ needs.channel-ui.result }}
        run: |
          # Only an explicit code=false permits skipped groups. Failed builds
          # also skip downstream jobs and must fail. An empty CODE means the
          # classifier failed, so fail closed instead of accepting an untested PR.
          if [ "${CODE}" = "false" ]; then expected=skipped; else expected=success; fi
          echo "code=${CODE}; each group must finish with ${expected}"
          status=0
          # A failed classifier skips its dependents. Check it explicitly
          # rather than relying on the expected downstream status.
          if [ "${CHANGES}" != "success" ]; then
            echo "::error title=CI gate::changes finished with ${CHANGES}; expected success, cannot classify changes"
            status=1
          fi
          for pair in "issue-link:${ISSUE_LINK}" \
                      "build:${BUILD}" \
                      "alpha-compat:${ALPHA_COMPAT}" \
                      "render-scroll:${RENDER_SCROLL}" \
                      "input-terminal:${INPUT_TERMINAL}" \
                      "session-workspace:${SESSION_WORKSPACE}" \
                      "channel-ui:${CHANNEL_UI}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            echo "${name}: ${result}"
            if [ "${result}" != "${expected}" ]; then
              echo "::error title=CI gate::${name} finished with ${result}; expected ${expected}"
              status=1
            fi
          done
          exit "${status}"
