
name: agent-foundation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      CI: true
      DSH_TUI_LANG: zh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -r build
      - run: pnpm verify:structure --item 1.1
      - run: pnpm check:work --item 1.1 --evidence evidence/work/1.1
